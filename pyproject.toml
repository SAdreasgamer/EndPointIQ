[project]
name = "endpointiq"
version = "0.1.0"
description = "AI-powered API intelligence platform — autonomous endpoint analysis with 99% token optimization"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Shrey Anand" },
]
keywords = ["api", "ai", "code-analysis", "langchain", "langgraph", "endpoints"]

dependencies = [
    # AI / Agent
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.4",
    "tiktoken>=0.7",

    # Parsing & Analysis
    "tree-sitter>=0.21.3,<0.22",
    "tree-sitter-languages>=1.10",
    "networkx[default]>=3.3",
    "numpy>=1.26",

    # Data
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Observation
    "watchdog>=4.0",

    # Server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # Logging
    "structlog>=24.0",

    # Utilities
    "python-dotenv>=1.0",
    "gitpython>=3.1",
]

[project.scripts]
eiq = "endpointiq.cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
